[dev]
  command = "pnpm run dev"
  targetPort = 5000
  port = 8888

[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "10.29.3"

[[redirects]]
  from = "/blog"
  to = "/posts/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/posts/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/tags"
  to = "/posts/"
  status = 301
  force = true

[[redirects]]
  from = "/tags/*"
  to = "/posts/tag/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/404"
  status = 404